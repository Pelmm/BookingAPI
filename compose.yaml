
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build: .
    environment:
      PORT: 8080
      INSTANCE_NAME: api-1
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api2:
    build: .
    environment:
      PORT: 8080
      INSTANCE_NAME: api-2
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api3:
    build: .
    environment:
      PORT: 8080
      INSTANCE_NAME: api-3
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bookingdb
      DB_USER: bookinguser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  postgres_data:
