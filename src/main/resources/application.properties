spring.application.name=BookingAPI

# Server
server.port=${PORT:8080}
app.instance-name=${INSTANCE_NAME:api-1}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookingdb}
spring.datasource.username=${DB_USER:bookinguser}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
